name: Build Ace AI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  MODEL_URL: https://huggingface.co/bartowski/SmolLM2-360M-Instruct-GGUF/resolve/main/SmolLM2-360M-Instruct-Q4_K_M.gguf
  SMALL_MODEL_URL: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf
  WLLAMA_VERSION: 2.3.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create app project
        run: |
          mkdir -p app/www/models app/assets
          cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3 @wllama/wllama@${WLLAMA_VERSION}
          cp ../index.html www/index.html
          cp -r node_modules/@wllama/wllama/esm www/wllama
          cp ../icon-*.png ../splash*.png assets/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aceai.app",
            "appName": "Ace AI",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF

      - name: Download model
        working-directory: app
        run: |
          curl -L --fail --retry 5 -o www/models/model.gguf "$MODEL_URL"
          echo "{\"bytes\": $(stat -c%s www/models/model.gguf)}" > www/models/model.json
          curl -L --fail --retry 5 -o www/models/small.gguf "$SMALL_MODEL_URL"
          echo "{\"bytes\": $(stat -c%s www/models/small.gguf)}" > www/models/small.json
          ls -lh www/models

      - name: Add Android and icons
        working-directory: app
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Patch Android for low-memory phones
        working-directory: app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<application android:largeHeap="true" android:hardwareAccelerated="true"|' $MANIFEST
          sed -i 's|<activity|<activity android:screenOrientation="portrait"|' $MANIFEST
          cat >> android/app/build.gradle <<'EOF'

          android {
              androidResources {
                  noCompress 'gguf', 'wasm'
              }
          }
          EOF
          grep -n "largeHeap\|screenOrientation" $MANIFEST

      - name: Enable multi-core AI (cross-origin isolation)
        working-directory: app
        run: |
          mkdir -p android/app/src/main/java/com/aceai/app
          cat > android/app/src/main/java/com/aceai/app/MainActivity.java <<'EOF'
          package com.aceai.app;

          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              final WebView wv = getBridge().getWebView();
              wv.setWebViewClient(new BridgeWebViewClient(getBridge()) {
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                  WebResourceResponse r = super.shouldInterceptRequest(view, request);
                  if (r != null) {
                    Map<String, String> h = new HashMap<>();
                    if (r.getResponseHeaders() != null) h.putAll(r.getResponseHeaders());
                    h.put("Cross-Origin-Opener-Policy", "same-origin");
                    h.put("Cross-Origin-Embedder-Policy", "require-corp");
                    h.put("Cross-Origin-Resource-Policy", "same-origin");
                    r.setResponseHeaders(h);
                  }
                  return r;
                }
              });
              String u = wv.getUrl();
              if (u == null || u.isEmpty()) u = "https://localhost/";
              wv.loadUrl(u);
            }
          }
          EOF

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ace-AI-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
