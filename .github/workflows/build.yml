name: Build Ace AI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # Small model = less RAM. If the app still closes, swap for a smaller one.
  MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
  WLLAMA_VERSION: 2.3.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create app project
        run: |
          mkdir -p app/www/models app/assets
          cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3 @wllama/wllama@${WLLAMA_VERSION}
          cp ../index.html www/index.html
          cp -r node_modules/@wllama/wllama/esm www/wllama
          cp ../icon-*.png ../splash*.png assets/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aceai.app",
            "appName": "Ace AI",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF

      - name: Download model
        working-directory: app
        run: |
          curl -L --fail --retry 5 -o www/models/model.gguf "$MODEL_URL"
          echo "{\"bytes\": $(stat -c%s www/models/model.gguf)}" > www/models/model.json
          ls -lh www/models

      - name: Add Android and icons
        working-directory: app
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Patch Android for low-memory phones
        working-directory: app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # more heap for the app
          sed -i 's|<application|<application android:largeHeap="true" android:hardwareAccelerated="true"|' $MANIFEST
          # keep activity alive on rotate/keyboard, lock portrait
          sed -i 's|<activity|<activity android:screenOrientation="portrait"|' $MANIFEST
          # don't compress model/wasm (faster, less memory to read)
          cat >> android/app/build.gradle <<'EOF'

          android {
              androidResources {
                  noCompress 'gguf', 'wasm'
              }
          }
          EOF
          grep -n "largeHeap\|screenOrientation" $MANIFEST

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ace-AI-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
