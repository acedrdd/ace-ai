@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#212121;--fg:#ececec;--sub:#a0a0a0;--card:#2f2f2f;--btn:#ececec;--btnfg:#212121;--code:#171717}}
:root[data-theme="dark"]{--bg:#212121;--fg:#ececec;--sub:#a0a0a0;--card:#2f2f2f;--btn:#ececec;--btnfg:#212121;--code:#171717}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-weight:600;font-size:18px}
.brand{display:flex;align-items:center;gap:10px}
.logo{display:inline-block;height:26px;width:calc(26px*1.507);background:var(--fg);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.logo.big{display:block;height:84px;width:calc(84px*1.507);margin:0 auto 14px}
.right{display:flex;gap:2px}
.icon{background:transparent;color:var(--fg);border:0;font-size:20px;padding:8px;border-radius:10px;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:8px 14px}
.col{max-width:720px;margin:0 auto}
.row{display:flex;margin:14px 0}
.row.user{justify-content:flex-end}
.bubble{background:var(--card);padding:9px 16px;border-radius:20px;max-width:85%;white-space:pre-wrap}
.bot{white-space:pre-wrap;width:100%}
.bot pre{background:var(--code);padding:12px;border-radius:10px;overflow-x:auto;white-space:pre}
.bot code{background:var(--code);padding:1px 5px;border-radius:5px;font-size:.92em}
.bot pre code{padding:0;background:none}
#hero{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:26px;font-weight:600;padding:20px}
#hero small{display:block;font-size:14px;font-weight:400;color:var(--sub);margin-top:8px}
#loader{display:block;text-align:center;padding:6px 20px 14px}
#lpct{font-size:40px;font-weight:700;line-height:1.1}
#lbar{height:10px;background:var(--card);border-radius:10px;overflow:hidden;max-width:420px;margin:10px auto 6px}
#lfill{height:100%;width:0;background:var(--btn);transition:width .3s}
#lmb{font-size:14px;color:var(--sub)}
#prog{height:4px;background:var(--card);margin:0 12px;border-radius:4px;overflow:hidden}
#fill{height:100%;width:0;background:var(--btn);transition:width .3s}
#bar{padding:8px 12px 12px}
#box{max-width:720px;margin:0 auto;background:var(--card);border-radius:26px;display:flex;align-items:flex-end;padding:6px 6px 6px 16px;gap:8px}
textarea{flex:1;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;resize:none;max-height:150px;padding:8px 0}
#send{width:36px;height:36px;border-radius:50%;border:0;background:var(--btn);color:var(--btnfg);font-size:18px;cursor:pointer;flex:none}
#send:disabled{opacity:.3}
#note{text-align:center;font-size:12px;color:var(--sub);margin-top:6px;min-height:16px}
</style>
</head>
<body>
<header><span class="brand"><span class="logo"></span>Ace AI</span><span class="right"><button class="icon" id="theme" title="Light / dark">☾</button><button class="icon" id="new" title="New chat">✎</button></span></header>
<div id="log"><div id="hero"><div><span class="logo big"></span>How can I help you today?<small id="loadmsg">Loading…</small></div></div></div>
<div id="loader"><div id="lpct">0%</div><div id="lbar"><div id="lfill"></div></div><div id="lmb">0 MB · starting…</div></div>
<div id="prog"><div id="fill"></div></div>
<div id="bar">
  <div id="box"><textarea id="q" rows="1" placeholder="Message"></textarea><button id="send">↑</button></div>
  <div id="note"></div>
</div>

<script>
(function(){
  var r=document.documentElement;
  try{var t=localStorage.getItem("ace-theme");if(t)r.setAttribute("data-theme",t);}catch(e){}
  function dark(){var t=r.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;}
  function paint(){var b=document.getElementById("theme");if(b)b.textContent=dark()?"\u2600":"\u263E";}
  document.addEventListener("DOMContentLoaded",function(){
    paint();
    document.getElementById("theme").onclick=function(){var n=dark()?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("ace-theme",n);}catch(e){}paint();};
  });
})();
</script>
<script>
(function(){
  function fail(m){var h=document.getElementById("loadmsg");if(h){h.textContent=m;h.style.color="#d33";}var n=document.getElementById("note");if(n)n.textContent=m;}
  window.__aceFail=fail;
  if(location.protocol!=="http:"&&location.protocol!=="https:"){
    document.addEventListener("DOMContentLoaded",function(){fail("Can't start: page opened as "+location.protocol+"// Install the APK, or run a local server and open http://localhost:8080");});
  }
  setTimeout(function(){if(!window.__ace)fail("Ace AI engine failed to load.");},8000);
})();
</script>
<script type="module">
const $ = id => document.getElementById(id);
const log = $("log"), q = $("q"), send = $("send"), note = $("note");
let Wllama;
try { ({ Wllama } = await import("./wllama/index.js")); window.__ace = true; }
catch (e) { window.__ace = true; window.__aceFail("Engine files missing (wllama). Use the APK or the full zip from the build."); }

const MODEL = "models/qwen2.5-0.5b-instruct-q4_k_m.gguf";
const SYS = "You are Ace AI, a helpful assistant. Be concise.";
let wllama, history = [], busy = false, ready = false, queued = false, col;

const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const md = s => esc(s)
  .replace(/```(\w*)\n?([\s\S]*?)(```|$)/g, (_, l, c) => `<pre><code>${c}</code></pre>`)
  .replace(/`([^`\n]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");

function addRow(kind, html) {
  if (!col) { log.innerHTML = '<div class="col"></div>'; col = log.firstChild; }
  const r = document.createElement("div"); r.className = "row " + kind;
  const d = document.createElement("div"); d.className = kind === "user" ? "bubble" : "bot";
  d.innerHTML = html; r.appendChild(d); col.appendChild(r);
  log.scrollTop = log.scrollHeight; return d;
}
function newChat() {
  history = []; queued = false; col = null;
  log.innerHTML = '<div id="hero"><div><span class="logo big"></span>How can I help you today?</div></div>';
}
function setLoader(pct, text) {
  $("lpct").textContent = pct + "%"; $("lfill").style.width = pct + "%"; $("fill").style.width = pct + "%";
  $("lmb").textContent = text; note.textContent = "Loading " + pct + "% · " + text;
  const h = $("loadmsg"); if (h) h.textContent = "Loading… " + pct + "% · " + text;
}

async function boot() {
  try {
    if (!Wllama) return;
    if (typeof WebAssembly !== "object") throw new Error("WebAssembly is not supported on this phone");
    let total = 0;
    try { total = (await (await fetch("models/model.json")).json()).bytes || 0; } catch {}
    const res = await fetch(MODEL);
    if (!res.ok) throw new Error("Model file not found inside the app (" + res.status + ")");
    total = total || +res.headers.get("content-length") || 0;
    const reader = res.body.getReader();
    let got = 0, batch = [], bb = 0; const parts = [];
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      batch.push(value); bb += value.length; got += value.length;
      if (bb > 16e6) { parts.push(new Blob(batch)); batch = []; bb = 0; }
      const mb = Math.round(got / 1048576);
      setLoader(total ? Math.min(99, Math.floor(got / total * 100)) : 0,
                total ? `${mb} / ${Math.round(total / 1048576)} MB` : `${mb} MB`);
    }
    if (batch.length) parts.push(new Blob(batch));
    setLoader(99, "Starting the AI engine…");
    const u = p => new URL(p, location.href).href;
    wllama = new Wllama({
      "single-thread/wllama.wasm": u("wllama/single-thread/wllama.wasm"),
      "multi-thread/wllama.wasm": u("wllama/multi-thread/wllama.wasm")
    }, { allowOffline: true });
    await wllama.loadModel([new Blob(parts)], { n_ctx: 2048 });
    ready = true;
    $("prog").style.display = "none"; $("loader").style.display = "none";
    note.textContent = "Ready. Running offline on your phone's CPU (replies can be slow)";
    const h = $("loadmsg"); if (h) h.textContent = "Ready";
    q.focus(); if (queued) generate();
  } catch (e) {
    $("prog").style.display = "none"; $("loader").style.display = "none";
    const m = "Failed to start: " + (e.message || e);
    note.textContent = m; const h = $("loadmsg"); if (h) { h.textContent = m; h.style.color = "#d33"; }
  }
}

function buildPrompt() {
  const msgs = history.slice();
  const make = m => `<|im_start|>system\n${SYS}<|im_end|>\n` + m.map(x => `<|im_start|>${x.role}\n${x.content}<|im_end|>\n`).join("") + "<|im_start|>assistant\n";
  while (make(msgs).length > 3500 && msgs.length > 2) msgs.splice(0, 2);
  return make(msgs);
}

async function generate() {
  queued = false; busy = true; send.disabled = true;
  const out = addRow("bot", "Thinking…"); let acc = ""; const dec = new TextDecoder();
  try {
    try { await wllama.kvClear(); } catch {}
    await wllama.createCompletion(buildPrompt(), {
      nPredict: 256,
      sampling: { temp: 0.6, top_k: 40, top_p: 0.9 },
      onNewToken: (t, piece) => {
        acc += dec.decode(piece, { stream: true });
        out.innerHTML = md(acc.replace(/<\|im_end\|>[\s\S]*/, "")); log.scrollTop = log.scrollHeight;
      }
    });
    history.push({ role: "assistant", content: acc.replace(/<\|im_end\|>[\s\S]*/, "") });
  } catch (e) { out.textContent = "Error: " + (e.message || e); }
  busy = false; send.disabled = false;
}

function ask() {
  const text = q.value.trim();
  if (!text || busy) return;
  q.value = ""; q.style.height = "auto";
  addRow("user", esc(text)); history.push({ role: "user", content: text });
  if (!ready) { queued = true; note.textContent = "Starting up. I will answer as soon as I'm ready…"; return; }
  generate();
}
send.onclick = ask;
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && innerWidth > 700) { e.preventDefault(); ask(); }});
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = q.scrollHeight + "px"; });
$("new").onclick = newChat;
boot();
</script>
</body>
</html>
